
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>JARVIS Smooth Slow-Motion Engine</title>

    <style>
        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            /*
             * Prevent accidental touch/selection effects.
             */
            user-select: none;
            -webkit-user-select: none;

            -webkit-tap-highlight-color: transparent;
        }


        /* =========================================================
           VIDEO CONTAINER
        ========================================================= */

        .video-container {
            position: relative;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000000;
        }


        /* =========================================================
           VIDEO LAYERS
        ========================================================= */

        video {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            /*
             * Fill screen without distortion.
             */
            object-fit: cover;

            /*
             * Video must remain renderable.
             * DO NOT use visibility:hidden.
             */
            visibility: visible;

            pointer-events: none;

            background: transparent;

            /*
             * Default hidden layer.
             */
            opacity: 0;

            /*
             * Smooth state transition.
             */
            transition:
                opacity 160ms
                cubic-bezier(0.22, 1, 0.36, 1);

            /*
             * GPU/compositor optimization.
             */
            transform: translate3d(0, 0, 0);

            -webkit-transform: translate3d(0, 0, 0);

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            will-change: opacity, transform;

            /*
             * Image quality enhancement.
             */
            image-rendering: -webkit-optimize-contrast;

            /*
             * JARVIS visual tuning.
             */
            filter:
                contrast(1.18)
                brightness(1.05)
                saturate(1.20);

            -webkit-filter:
                contrast(1.18)
                brightness(1.05)
                saturate(1.20);
        }


        /* =========================================================
           CURRENT VIDEO
        ========================================================= */

        video.active {
            opacity: 1;

            z-index: 10;
        }


        /* =========================================================
           NEXT VIDEO PREPARATION
        ========================================================= */

        video.preparing {
            opacity: 0;

            z-index: 5;
        }


        /* =========================================================
           TRANSITION VIDEO
        ========================================================= */

        video.transitioning {
            opacity: 1;

            z-index: 20;
        }


        /* =========================================================
           OPTIONAL: REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            video {
                transition: opacity 0ms linear;
            }
        }
    </style>
</head>


<body>

<div class="video-container">

    <!-- =====================================================
         IDLE
    ====================================================== -->

    <video
            id="v-idle"
            src="../Anime/Idle.mp4"
            loop
            muted
            playsinline
            autoplay
            preload="auto">
    </video>


    <!-- =====================================================
         THINKING
    ====================================================== -->

    <video
            id="v-thinking"
            src="../Anime/thingking.mp4"
            loop
            muted
            playsinline
            autoplay
            preload="auto">
    </video>


    <!-- =====================================================
         TALKING
    ====================================================== -->

    <video
            id="v-talking"
            src="../Anime/talking.mp4"
            loop
            muted
            playsinline
            autoplay
            preload="auto">
    </video>

</div>


<script>

    /* =========================================================
       VIDEO REFERENCES
    ========================================================= */

    const videos = {

        IDLE:
            document.getElementById("v-idle"),

        LISTENING:
            document.getElementById("v-idle"),

        THINKING:
            document.getElementById("v-thinking"),

        SPEAKING:
            document.getElementById("v-talking"),

        SINGING:
            document.getElementById("v-talking")
    };


    /* =========================================================
       CONFIGURATION
    ========================================================= */

    const CONFIG = {

        /*
         * Video playback speed.
         *
         * 1.00 = Normal
         * 0.90 = Slightly slow
         * 0.80 = Slow
         * 0.75 = Recommended
         * 0.70 = Very slow
         * 0.60 = Cinematic slow
         */
        PLAYBACK_RATE: 0.75,


        /*
         * Crossfade duration.
         */
        TRANSITION_DURATION: 160,


        /*
         * Extra time for compositor/rendering.
         */
        FRAME_SETTLE_DELAY: 30,


        /*
         * Maximum time to wait for video readiness.
         */
        READY_TIMEOUT: 700,


        /*
         * How frequently we check paused videos.
         */
        PLAY_CHECK_INTERVAL: 2000
    };


    /* =========================================================
       STATE
    ========================================================= */

    let currentActive = videos.IDLE;

    let switchToken = 0;

    let switching = false;


    /* =========================================================
       APPLY VIDEO SETTINGS
    ========================================================= */

    Object.values(videos).forEach(video => {

        /*
         * Muted is important for autoplay.
         */
        video.muted = true;

        /*
         * Slow motion.
         */
        video.playbackRate =
            CONFIG.PLAYBACK_RATE;

        /*
         * Keep video in correct rendering mode.
         */
        video.defaultPlaybackRate =
            CONFIG.PLAYBACK_RATE;

        /*
         * Preload as much as possible.
         */
        video.preload = "auto";
    });


    /* =========================================================
       INITIAL STATE
    ========================================================= */

    currentActive.classList.add("active");


    /* =========================================================
       SET PLAYBACK RATE
    ========================================================= */

    function applyPlaybackRate(video) {

        try {

            video.defaultPlaybackRate =
                CONFIG.PLAYBACK_RATE;

            video.playbackRate =
                CONFIG.PLAYBACK_RATE;

        } catch (error) {

            console.warn(
                "Playback rate error:",
                error
            );
        }
    }


    /* =========================================================
       START VIDEO
    ========================================================= */

    async function ensurePlaying(video) {

        applyPlaybackRate(video);

        try {

            await video.play();

        } catch (error) {

            /*
             * Browser autoplay restriction.
             * Nothing fatal here.
             */
        }
    }


    /* =========================================================
       WAIT FOR VIDEO DATA
    ========================================================= */

    function waitForVideoReady(video) {

        return new Promise(resolve => {

            /*
             * HAVE_FUTURE_DATA or better.
             */
            if (video.readyState >= 3) {

                resolve();

                return;
            }


            let finished = false;


            const finish = () => {

                if (finished) {
                    return;
                }

                finished = true;


                video.removeEventListener(
                    "loadeddata",
                    finish
                );

                video.removeEventListener(
                    "canplay",
                    finish
                );

                video.removeEventListener(
                    "canplaythrough",
                    finish
                );


                resolve();
            };


            video.addEventListener(
                "loadeddata",
                finish,
                { once: true }
            );


            video.addEventListener(
                "canplay",
                finish,
                { once: true }
            );


            video.addEventListener(
                "canplaythrough",
                finish,
                { once: true }
            );


            /*
             * Safety timeout.
             */
            setTimeout(
                finish,
                CONFIG.READY_TIMEOUT
            );
        });
    }


    /* =========================================================
       WAIT FOR RENDER FRAME
    ========================================================= */

    function waitForRenderFrame() {

        return new Promise(resolve => {

            requestAnimationFrame(() => {

                requestAnimationFrame(() => {

                    setTimeout(
                        resolve,
                        CONFIG.FRAME_SETTLE_DELAY
                    );

                });

            });

        });
    }


    /* =========================================================
       RESET TRANSIENT VIDEO
    ========================================================= */

    function resetTransientVideo(
        video,
        state
    ) {

        /*
         * Thinking and speaking should start
         * from the beginning.
         */
        if (
            state === "THINKING" ||
            state === "SPEAKING"
        ) {

            try {

                video.currentTime = 0;

            } catch (error) {

                console.warn(
                    "Could not reset video:",
                    error
                );
            }
        }
    }


    /* =========================================================
       SET JARVIS STATE
    ========================================================= */

    window.setOrbState =
        async function(state) {

            const requestedState =
                String(
                    state || "IDLE"
                ).toUpperCase();


            /*
             * Resolve requested video.
             */
            const nextVideo =
                videos[requestedState] ||
                videos.IDLE;


            /*
             * No change required.
             */
            if (
                nextVideo ===
                currentActive
            ) {

                /*
                 * Make sure it keeps playing.
                 */
                ensurePlaying(nextVideo);

                return;
            }


            /*
             * Create unique switch ID.
             */
            const token =
                ++switchToken;


            console.log(
                "[JARVIS]",
                "Switching to:",
                requestedState
            );


            switching = true;


            /* =================================================
               STEP 1
               Prepare new video behind current video
            ================================================= */

            nextVideo.classList.remove(
                "active"
            );

            nextVideo.classList.remove(
                "transitioning"
            );

            nextVideo.classList.add(
                "preparing"
            );


            /* =================================================
               STEP 2
               Set speed
            ================================================= */

            applyPlaybackRate(
                nextVideo
            );


            /* =================================================
               STEP 3
               Reset transient states
            ================================================= */

            resetTransientVideo(
                nextVideo,
                requestedState
            );


            /* =================================================
               STEP 4
               Start playing
            ================================================= */

            await ensurePlaying(
                nextVideo
            );


            /*
             * If another state was requested
             * during this process, cancel this switch.
             */
            if (
                token !== switchToken
            ) {

                switching = false;

                return;
            }


            /* =================================================
               STEP 5
               Wait until actual video data exists
            ================================================= */

            await waitForVideoReady(
                nextVideo
            );


            /*
             * Check again.
             */
            if (
                token !== switchToken
            ) {

                switching = false;

                return;
            }


            /* =================================================
               STEP 6
               Wait for compositor
            ================================================= */

            await waitForRenderFrame();


            /*
             * Check again.
             */
            if (
                token !== switchToken
            ) {

                switching = false;

                return;
            }


            /* =================================================
               STEP 7
               Put new video on top
            ================================================= */

            nextVideo.classList.remove(
                "preparing"
            );

            nextVideo.classList.add(
                "transitioning"
            );


            /*
             * Wait one frame before
             * removing old layer.
             */
            requestAnimationFrame(() => {

                if (
                    token !== switchToken
                ) {

                    return;
                }


                /*
                 * New video is now visible.
                 */
                nextVideo.classList.add(
                    "active"
                );


                nextVideo.classList.remove(
                    "transitioning"
                );


                /*
                 * IMPORTANT:
                 * Old video remains visible
                 * for a short time.
                 */
                setTimeout(() => {

                    if (
                        token !== switchToken
                    ) {

                        return;
                    }


                    /*
                     * Only NOW remove old video.
                     */
                    currentActive.classList.remove(
                        "active"
                    );


                    currentActive =
                        nextVideo;


                    switching = false;


                    console.log(
                        "[JARVIS]",
                        "State active:",
                        requestedState
                    );


                }, CONFIG.TRANSITION_DURATION);

            });
        };


    /* =========================================================
       EMOTION BRIDGE
    ========================================================= */

    window.setAvatarEmotion =
        function(emotion) {

            console.log(
                "[JARVIS] Emotion:",
                emotion
            );
        };


    /* =========================================================
       AUDIO LEVEL BRIDGE
    ========================================================= */

    window.setAudioLevel =
        function(level) {

            /*
             * Reserved for future
             * audio-reactive animation.
             */
        };


    /* =========================================================
       PERSONALITY MODE BRIDGE
    ========================================================= */

    window.setPersonalityMode =
        function(mode) {

            console.log(
                "[JARVIS] Personality:",
                mode
            );
        };


    /* =========================================================
       START ALL VIDEOS
    ========================================================= */

    Object.values(videos).forEach(video => {

        applyPlaybackRate(video);

        ensurePlaying(video);

    });


    /* =========================================================
       KEEP VIDEOS PLAYING
    ========================================================= */

    setInterval(() => {

        Object.values(videos).forEach(video => {

            /*
             * Reapply playback speed.
             */
            applyPlaybackRate(video);


            /*
             * Prevent accidental pause.
             */
            if (video.paused) {

                ensurePlaying(video);
            }

        });

    }, CONFIG.PLAY_CHECK_INTERVAL);


    /* =========================================================
       INITIAL LOG
    ========================================================= */

    console.log(
        "JARVIS Smooth Engine Ready"
    );

    console.log(
        "Playback Rate:",
        CONFIG.PLAYBACK_RATE
    );

</script>

</body>
</html>
